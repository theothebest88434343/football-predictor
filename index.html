<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Football match predictions powered by AI and statistical models" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>MatchIQ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Twemoji: cross-platform emoji rendering -->
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script>
      function applyTwemoji() {
        if (typeof twemoji === 'undefined') return;
        twemoji.parse(document.body, {
          folder: 'svg',
          ext: '.svg',
          base: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/',
        });
      }
      // Run after React mounts and on every DOM change
      var _twObserver = new MutationObserver(function(mutations) {
        _twObserver.disconnect();
        applyTwemoji();
        _twObserver.observe(document.body, { childList: true, subtree: true });
      });
      document.addEventListener('DOMContentLoaded', function() {
        applyTwemoji();
        _twObserver.observe(document.body, { childList: true, subtree: true });
      });
    </script>
  </body>
</html>
